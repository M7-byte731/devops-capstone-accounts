[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-inclusive=1
cover-package=service

[coverage:report]
show_missing=True

[flake8]
max-line-length = 120
exclude = .git,__pycache__,venv,.venv

[pylint.messages_control]
disable = missing-docstring,too-few-public-methods,invalid-name
